# ZooKeeper 3.9.6, сервер 1 из 3
tickTime=2000
initLimit=10
syncLimit=5
# у каждого сервера своя папка данных (в ней лежит myid = 1)
dataDir=/var/zookeeper/data1
# у каждого сервера свой клиентский порт
clientPort=2181
# строки участников ансамбля одинаковые у всех трёх: host:порт_кворума:порт_выборов
server.1=zk1:2888:3888
server.2=zk2:2889:3889
server.3=zk3:2890:3890
4lw.commands.whitelist=srvr,stat,ruok,mntr
admin.enableServer=false
